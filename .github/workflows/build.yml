on:
  pull_request:
name: Build
jobs:
  build_docker:
    strategy:
      fail-fast: false
      matrix:
        target: [gcc11_debug, gcc11, gcc14, clang19, nvcc12, nvcc12_debug, rocm6_4_3, rocm_latest, sycl]
    runs-on: ubuntu-latest
    steps:
    - run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
    - uses: actions/checkout@v2
      with:
        submodules: recursive
    - uses: docker/setup-buildx-action@v3
    - uses: docker/build-push-action@v6
      with:
        target: ${{ matrix.target }}
  build_mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v2
        with:
          submodules: recursive

## Back off to version of cmake not on "bleeding edge"
      - name: Install CMake 3.29
        uses: lukka/get-cmake@e6906078ebd1ccb8ce51ab4626ac46a1b5a517e3  # v4.4.0
        with:
          cmakeVersion: "~3.29.0"

      - uses: threeal/cmake-action@v1.3.0
        with:
          build-dir: build
          options:
            CMAKE_CXX_STANDARD=20
            ENABLE_OPENMP=Off
            CMAKE_BUILD_TYPE=Release
          run-build: true
          build-args: '--parallel 4'
      - uses: threeal/ctest-action@v1.1.0
  build_windows:
    strategy:
      matrix:
        shared:
        - args:
            BUILD_SHARED_LIBS=On
            CMAKE_WINDOWS_EXPORT_ALL_SYMBOLS=On
        - args: BUILD_SHARED_LIBS=Off

    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v2
        with:
          submodules: recursive
## ====================================
## Config and build action

## Back off to version of cmake not on "bleeding edge"
      - name: Install CMake 3.29
        uses: lukka/get-cmake@e6906078ebd1ccb8ce51ab4626ac46a1b5a517e3  # v4.4.0
        with:
          cmakeVersion: "~3.29.0"

      - uses: threeal/cmake-action@v1.3.0
        with:
          build-dir: build
          options:
            ENABLE_WARNINGS_AS_ERRORS=Off
            BLT_CXX_STD="c++20"
            CMAKE_CXX_STANDARD=20
            CMAKE_BUILD_TYPE=Release
            ${{ matrix.shared.args }}
          run-build: true
          build-args: '--config Release --parallel 4'
## ====================================
## Print the contents of the test directory in the build space (debugging)
##    - run: |
##        dir -r D:\a\camp\camp\build\test
## ====================================
## Run tests action
      - uses: threeal/ctest-action@v1.1.0
        with:
          build-config: Release
